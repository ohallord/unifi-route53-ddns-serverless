# serverless.yml

service: aws-python-ddns

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.11
  region: us-east-1 # Feel free to change this to your preferred region
  logRetentionInDays: 30
  iam:
    role:
      statements:
        # Only UPSERT of the single configured A record is allowed.
        - Effect: 'Allow'
          Action:
            - 'route53:ChangeResourceRecordSets'
          Resource: 'arn:aws:route53:::hostedzone/*'
          Condition:
            'ForAllValues:StringEquals':
              'route53:ChangeResourceRecordSetsNormalizedRecordNames':
                - ${self:custom.hostname}
              'route53:ChangeResourceRecordSetsRecordTypes':
                - 'A'
              'route53:ChangeResourceRecordSetsActions':
                - 'UPSERT'
        - Effect: 'Allow'
          Action:
            - 'route53:ListResourceRecordSets'
          Resource: 'arn:aws:route53:::hostedzone/*'
        - Effect: 'Allow'
          Action:
            - 'route53:ListHostedZones'
          Resource: '*'
        - Effect: 'Allow'
          Action:
            - 'secretsmanager:GetSecretValue'
          Resource: !Ref DDNSCredentialsSecret

custom:
  # FQDN to update, lowercase, no trailing dot. Pass with --param="hostName=home.example.com"
  hostname: ${param:hostName}

functions:
  authorizer:
    handler: src/handler.authorizer_handler
    environment:
      DDNS_SECRET_NAME: !Ref DDNSCredentialsSecret
  updateIp:
    handler: src/handler.lambda_handler
    description: Updates a Route 53 'A' record to emulate a No-IP compatible DDNS provider.
    environment:
      DDNS_HOSTNAME: ${self:custom.hostname}
    events:
      - http:
          path: /{proxy+}
          method: any
          authorizer:
            name: authorizer
            type: request
            resultTtlInSeconds: 300
            identitySource:
              - method.request.header.Authorization

package:
  patterns:
    - '!**'
    - 'src/**'
    - '!src/**/__pycache__/**'

resources:
  Resources:
    DDNSCredentialsSecret:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: /ddns/${self:service}/${sls:stage}
        Description: "DDNS credentials for the UniFi gateway"
        # The password is generated by Secrets Manager so it never appears in the
        # CloudFormation template or deployment bucket. Retrieve it after deploy
        # (see README). It is only regenerated if this block changes.
        GenerateSecretString:
          SecretStringTemplate: '{"username": "${param:ddnsUsername}"}'
          GenerateStringKey: password
          PasswordLength: 32
          ExcludePunctuation: true
  Outputs:
    DDNSSecretName:
      Description: Secrets Manager secret holding the DDNS username and password
      Value: !Ref DDNSCredentialsSecret
